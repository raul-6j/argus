# Alembic configuration for ARGUS.
#
# Deliberately minimal: `sqlalchemy.url` is NOT set here. The URL is resolved
# at runtime by migrations/env.py from the DATABASE_URL environment variable,
# falling back to configs/api_config.yaml's `database_url` — one source of
# truth shared with the app, and no production credentials committed to git.
#
# Usage:
#   alembic upgrade head                       # apply pending migrations
#   alembic current                            # what the DB is at
#   alembic history                            # what exists
#   alembic revision --autogenerate -m "..."   # draft a new migration
#
# ALWAYS read a generated migration before applying it. Autogenerate does not
# detect renames (it emits drop + add, which loses data), server-default
# changes, or anything requiring a data backfill.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
