# ARGUS — Flask API configuration (Phase 6)
# Loaded once by src/api/app.py::create_app() at process startup.

# Model artefacts (Phase 5 output — git-ignored, must exist locally before
# starting the API: run scripts/train.py + scripts/evaluate.py first).
model_path: models/production/model.joblib
model_metadata_path: models/production/metadata.json

# CORS — locked to the extension origin only. The ID below is deterministic
# (not Chrome-assigned at random): extension/manifest.json pins a "key"
# (the extension's RSA public key), and Chrome derives the extension ID from
# it — id = base32-ish-map(SHA256(DER public key)[:16 bytes]). Loading
# extension/ unpacked in Chrome will therefore always produce this exact ID.
# If Chrome ever shows a different ID, trust Chrome and update this value —
# it is the ground truth, this is a derivation.
cors_origins:
  - "chrome-extension://dhmdjnjpmbiahdoglbgcdpkilaodlcpd"

# flask-limiter. In-memory storage is fine for a single-process dev/thesis
# deployment; point storage_uri at redis://... for a multi-worker production
# deployment (gunicorn with >1 worker needs a shared store, or each worker
# enforces its own independent limit).
#
# Phase 2 (G2): when storage_uri starts with "redis://", create_app() pings
# Redis at boot and REFUSES TO START if it's unreachable -- "fail loud" so a
# misconfigured/down Redis never silently degrades every rate limit to
# unenforced. This mirrors S6's SECRET_KEY fail-closed philosophy. Dev stays
# on memory:// (no boot-time check, no Redis dependency) unless explicitly
# switched to redis:// here.
rate_limit: "100 per minute"
rate_limit_storage_uri: "memory://"
# rate_limit_storage_uri: "redis://localhost:6379/0"   # prod / multi-worker

# Number of reverse proxies between the client and this app. Controls
# werkzeug's ProxyFix (src/api/app.py::_apply_proxy_fix).
#
# 0 (the default) ignores X-Forwarded-* entirely: correct for local dev and
# for direct exposure. Behind a proxy this MUST be set, or every rate limit
# above keys on the proxy's own IP -- one bucket shared by every client on
# the internet, which makes the per-IP auth limits meaningless.
#
# Set it to the EXACT number of hops. X-Forwarded-For is client-supplied, and
# ProxyFix trusts the last `trusted_proxy_count` entries; a value larger than
# the real hop count lets a caller prepend forged entries and pick its own
# rate-limit identity. Azure Container Apps behind its built-in ingress = 1;
# add 1 for each additional proxy/CDN you terminate through.
trusted_proxy_count: 0

# Hard ceiling on any request body. Werkzeug rejects anything larger with 413
# without reading the body at all, so an anonymous caller cannot spend the
# process's memory on a request that was never going to be valid. The largest
# legitimate body is a PUT /vault blob, which is separately (and more tightly)
# capped by MAX_CIPHERTEXT_CHARS in src/api/vault/routes.py.
max_content_length_bytes: 1048576   # 1 MiB

# Phase 2 (C1): dedicated, stricter limit for the public scan endpoint --
# it triggers a real outbound fetch of a user-supplied URL, unlike /detect's
# default (hostname-only, no fetch) fast path.
scan_rate_limit: "20 per minute"

# Phase 2 (C3): per-API-key tiered limits for /v1/*, keyed on the api-key's
# id (not remote IP) so limits are per-tenant regardless of shared egress
# IPs. Requires the redis storage_uri above to actually hold across workers
# -- see docs/PHASE_2_IMPLEMENTATION_PLAN.md §G2.
api_key_tiers:
  free: "60 per minute"
  pro: "600 per minute"

# Phase 2 (C1): how long a public scan report stays fetchable at its
# permalink before GET /scan/<id> starts returning 404.
scan_store:
  ttl_days: 7

# Phase 2 (C3): max URLs accepted in one POST /v1/scan/batch request. Each
# URL in a batch counts individually against the caller's per-key rate
# budget (documented in docs/API_DESIGN_SPECIFICATION.md) so batching can't
# be used to bypass the tier limit.
batch_max: 50

# Phase 2 (G1): short-TTL verdict cache (src/serving/cache.py), keyed on
# normalize_url(url)+enrich. Reuses the Redis instance above when
# rate_limit_storage_uri is redis://; falls back to an in-process LRU cache
# in dev. The threat-intel prefilter always runs BEFORE the cache lookup,
# so a newly-blocklisted URL is never masked by a stale cached "legitimate".
cache:
  enabled: true
  ttl_s: 300

# Enrichment (HTML fetch + WHOIS/DNS) is OFF by default — it's the slow path
# (seconds, not milliseconds) and turns /detect into a live outbound fetch of
# untrusted content. Callers opt in per-request via {"enrich": true}.
enrich_default: false
ssrf_timeout_s: 5

# Persistent thread pool for enrichment work (Task 6.2) — sized to bound
# worst-case concurrent WHOIS/HTML fetches without spawning unboundedly.
enrichment_max_workers: 8

# Wall-clock ceiling on one enrichment run (HTML fetch + WHOIS/DNS), enforced
# by the pool above in src/api/verdict.py::extract. Applies to EVERY scanning
# endpoint — /detect, /explain, /v1/scan, /v1/scan/batch, /v1/explain,
# POST /scan and async jobs all go through that one helper.
#
# This is the outer bound, and it is the only one that bounds total time: the
# per-socket `requests` timeouts inside the fetchers reset on every byte
# received, so they do not constrain a server that trickles data (slowloris).
# Exceeding it degrades that request to a lexical-only verdict rather than
# erroring.
enrichment_timeout_s: 15

# F19: a separate, dedicated thread pool for POST /v1/scan/async jobs — kept
# apart from enrichment_max_workers above so a burst of async submissions
# can't starve (or be starved by) synchronous /v1/scan enrichment work
# sharing one process.
async_job_max_workers: 4

# F19: webhook delivery for completed async scan jobs. Bounded, in-process
# retries only — deliberately no persistent retry queue/scheduler, the same
# "scheduling stays external" convention F7 established (DEC-035). A
# webhook endpoint that's down for longer than these few attempts needs the
# caller to notice and fall back to polling GET /v1/scan/async/<job_id>,
# which always holds the authoritative result regardless of webhook outcome.
webhook_delivery:
  timeout_s: 5
  max_attempts: 3
  retry_backoff_s: [0, 2, 8]

# Decision threshold — kept in sync with configs/model_config.yaml (DEC-017)
# rather than duplicated as a second source of truth; app.py reads it from
# model_config.yaml at startup. Present here only as a documented pointer.
threshold_source: configs/model_config.yaml

# --- Auth + vault (Phase 8) ---
# SQLite for dev; a real deployment would point this at PostgreSQL, per
# the project's stated production DB target — no code change needed, just this URL.
database_url: "sqlite:///argus_dev.db"

# S6: SECRET_KEY is intentionally NOT here — it must come from the
# SECRET_KEY environment variable only (src/api/auth/utils.py::get_secret_key
# fails closed if unset). Putting a default here would defeat the point.

# No email backend is configured (no SMTP credentials exist for this
# project) — see DEC-021. When true, /auth/signup includes the OTP in its
# JSON response instead of "sending" it, for local development/testing only.
# MUST be false (the default) in any deployment reachable by anyone but you.
auth_dev_return_otp: true

# Extra, tighter per-route limits on the auth endpoints most attractive to
# brute force/credential-stuffing, independent of S4's per-account OTP
# lockout (which only kicks in after an OTP has already been issued) and
# independent of the global `rate_limit` above. Not hardcoded in app.py
# (Iron Law #2) so tests can override them without changing production
# defaults — see tests/api/conftest.py.
auth_rate_limits:
  login: "10 per minute"
  signup: "5 per minute"
  verify_otp: "10 per minute"
