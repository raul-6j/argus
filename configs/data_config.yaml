# configs/data_config.yaml
# ARGUS — Data pipeline configuration for scripts/data_prep.py
# All pipeline parameters live here. Never hardcode paths or thresholds in Python.

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  uci_csv: "data/raw/uci_phishing.csv"           # written by download step
  kaggle_csv: "data/raw/kaggle_phishing.csv"      # written by download step

# ---------------------------------------------------------------------------
# Download settings
# ---------------------------------------------------------------------------
download:
  uci_repo_id: 327                                # ucimlrepo dataset ID
  kaggle_dataset: "shashwatwork/web-page-phishing-detection-dataset"
  # If kaggle CLI is not configured, data_prep.py will print setup instructions
  # and exit cleanly rather than crashing.

# ---------------------------------------------------------------------------
# Label policy
# ---------------------------------------------------------------------------
labels:
  # UCI Result encoding: -1=phishing, 0=suspicious, 1=legitimate
  # Allowed values: merge_phishing | drop
  # See DECISIONS.md DEC-007 — third_class is intentionally unsupported.
  suspicious_class_policy: "merge_phishing"
  phishing_value: 1
  legit_value: 0

  # Kaggle dataset label column and its raw values
  kaggle_label_col: "status"
  kaggle_phishing_raw: "phishing"
  kaggle_legit_raw: "legitimate"

# ---------------------------------------------------------------------------
# UCI feature rename map
# Raw UCI column name → internal name used throughout ARGUS
# All values are categorical: -1/0/1 (pre-thresholded by original authors)
# ---------------------------------------------------------------------------
uci_rename:
  # ucimlrepo normalises UCI column names to lowercase at download time.
  # Original mixed-case names (e.g. "having_IP_Address") are NOT used.
  having_ip_address: "has_ip_address"
  url_length: "url_length_cat"          # -1: >75 chars, 0: 54-75, 1: <54
  shortining_service: "has_shortening"
  having_at_symbol: "has_at_symbol"
  double_slash_redirecting: "has_double_slash"
  prefix_suffix: "has_prefix_suffix"
  having_sub_domain: "subdomain_level"  # -1: many, 0: some, 1: none
  sslfinal_state: "ssl_state"           # -1: no HTTPS, 0: self-signed, 1: trusted CA
  domain_registration_length: "domain_reg_length"
  favicon: "has_favicon"
  port: "has_port"
  https_token: "https_in_domain"
  request_url: "request_url_ratio"      # ratio of external resource URLs
  url_of_anchor: "anchor_url_ratio"
  links_in_tags: "links_in_tags"
  sfh: "server_form_handler"
  submitting_to_email: "submits_to_email"
  abnormal_url: "is_abnormal_url"
  redirect: "has_redirect"
  on_mouseover: "has_onmouseover"
  rightclick: "right_click_disabled"
  popupwindow: "has_popup"
  iframe: "has_iframe"
  age_of_domain: "domain_age_cat"       # -1: <6 months, 0: 6-12 months, 1: >12 months
  dnsrecord: "has_dns_record"
  web_traffic: "web_traffic"
  page_rank: "page_rank"
  google_index: "google_indexed"
  links_pointing_to_page: "inbound_links"
  statistical_report: "in_statistical_report"
  # "result" is consumed by normalise_labels (→ "label") before rename_columns runs.
  # Pass "label" through so rename_columns keeps it in the output column set.
  label: "label"

# ---------------------------------------------------------------------------
# Kaggle feature rename map
# Maps shashwatwork dataset columns → ARGUS internal names
# Only columns that overlap with UCI features are kept for schema alignment.
# Kaggle-exclusive features (87 total) are dropped unless listed here.
# ---------------------------------------------------------------------------
kaggle_rename:
  ip: "has_ip_address"
  shortening_service: "has_shortening"
  having_At_Symbol: "has_at_symbol"     # some versions use UCI-style names
  nb_at: "has_at_symbol"                # alternative column name
  prefix_suffix: "has_prefix_suffix"
  nb_subdomains: "subdomain_level"
  https_token: "https_in_domain"
  links_in_tags: "links_in_tags"
  sfh: "server_form_handler"
  submit_email: "submits_to_email"
  iframe: "has_iframe"
  popup_window: "has_popup"
  onmouseover: "has_onmouseover"
  right_click: "right_click_disabled"
  external_favicon: "has_favicon"
  port: "has_port"
  domain_registration_length: "domain_reg_length"
  domain_age: "domain_age_cat"
  dns_record: "has_dns_record"
  web_traffic: "web_traffic"
  page_rank: "page_rank"
  google_index: "google_indexed"
  statistical_report: "in_statistical_report"
  status: "label"

# ---------------------------------------------------------------------------
# Feature contract
# The 30 features the model will train on (post-merge, post-clean).
# This list drives ColumnTransformer ordering at training time.
# Update model_version in feature_config.yaml if this list changes.
# ---------------------------------------------------------------------------
feature_columns:
  - has_ip_address
  - url_length_cat
  - has_shortening
  - has_at_symbol
  - has_double_slash
  - has_prefix_suffix
  - subdomain_level
  - ssl_state
  - domain_reg_length
  - has_favicon
  - has_port
  - https_in_domain
  - request_url_ratio
  - anchor_url_ratio
  - links_in_tags
  - server_form_handler
  - submits_to_email
  - is_abnormal_url
  - has_redirect
  - has_onmouseover
  - right_click_disabled
  - has_popup
  - has_iframe
  - domain_age_cat
  - has_dns_record
  - web_traffic
  - page_rank
  - google_indexed
  - inbound_links
  - in_statistical_report

# ---------------------------------------------------------------------------
# Preprocessing
# ---------------------------------------------------------------------------
preprocessing:
  # Columns with null rate > this threshold are dropped entirely
  max_null_rate: 0.50

  # Imputation strategy per feature type
  # Kaggle dataset may have some nulls for UCI-only features
  impute_strategy:
    categorical_int: "mode"     # for -1/0/1 columns: fill with mode
    fallback: "mode"

  # Drop exact duplicate rows (all 30 features + label identical)
  drop_duplicates: true

# ---------------------------------------------------------------------------
# Train / val / test split
# ---------------------------------------------------------------------------
split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  random_state: 42
  stratify: true                # always stratify on label

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------
output:
  train_parquet: "data/processed/train.parquet"
  val_parquet: "data/processed/val.parquet"
  test_parquet: "data/processed/test.parquet"
  stats_json: "data/processed/dataset_stats.json"
  # Fallback to CSV if pyarrow is unavailable (set by data_prep.py at runtime)
  fallback_csv: false
