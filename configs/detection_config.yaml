# ARGUS — Detection fusion-layer configuration (Phase 1, DEC-A; extended Phase 2)
# Loaded once by src/api/app.py::create_app() at process startup, alongside
# api_config.yaml, model_config.yaml, and threat_intel_config.yaml.
#
# Scope (DEC-A): this layer combines the trained ML model's phishing
# probability with deterministic, explainable brand-intelligence signals
# (typosquat/homograph, favicon/logo match, brand-vs-domain mismatch,
# TLS certificate intelligence, redirect-chain unwrapping). It does NOT
# retrain or modify the 18-feature ML model. If this file is absent, or
# `enabled: false`, /detect and /explain behave exactly as they did before
# Phase 1 (model-only), unchanged — backward compatible by design, matching
# threat_intel_config.yaml's graceful-degradation convention.
#
# Signals only run when a request is enriched (POST /detect {"enrich":
# true}, or /explain, which always enriches) — the default hostname-only
# fast path is completely untouched by this file.

enabled: true

# Path to the brand reference asset (DEC-C), relative to the project root.
brand_reference_path: data/reference/brands.json

# Fusion threshold. Kept equal to model_config.yaml's calibrated threshold
# (0.30, DEC-017) so that "no signal triggers" reproduces the model-only
# decision exactly — if the model threshold is ever recalibrated, update
# this value too.
fusion_threshold: 0.30

# Relative weights in the fusion weighted-sum (src/detection/fusion.py).
# `model` is the ML model's own contribution; a signal's weight only
# applies when that signal actually triggers. Values are relative, not
# required to sum to 1.0 -- fuse() normalizes by the total weight that
# actually contributed to a given verdict.
signal_weights:
  model: 1.0
  typosquat: 0.6
  favicon_match: 0.9
  brand_mismatch: 0.8
  # Phase 2 additions:
  cert_intel: 0.4     # cert age/issuer is corroborating evidence, deliberately
                       # lighter than the brand-identity signals above -- "has
                       # a fresh free-CA cert" alone is common among legit
                       # sites too (see src/detection/signals/cert_intel.py).
  redirect_chain: 0.7  # this signal only ever triggers when a fresh A3
                        # typosquat check on the FINAL landing URL already
                        # fired, so it's nearly as high-confidence as
                        # typosquat itself.
  # Phase 3 additions:
  credential_context: 0.55  # requires a sensitive-field axis PLUS a
                             # corroborating axis (cross-origin post or a
                             # recently-registered domain) before triggering
                             # at all -- see
                             # src/detection/signals/credential_context.py.
                             # The one exception (a crypto seed-phrase input
                             # field, which can trigger alone) is itself rare
                             # enough on legitimate pages to justify the
                             # weight without corroboration.
  platform_risk: 0.5   # never triggers alone -- only ever corroborates an
                        # already-triggered brand_mismatch or
                        # credential_context signal on a known free/shared
                        # hosting platform (DEC-018's documented blind spot).
  # Phase 6 addition:
  semantic_content: 0.45  # social-engineering content-taxonomy match (F17).
                           # Never triggers alone -- requires an already-
                           # triggered brand_mismatch/credential_context or a
                           # recently-registered domain, same corroboration
                           # convention as platform_risk -- see
                           # src/detection/signals/semantic_content.py.
                           # Deliberately kept below credential_context
                           # (0.55): matched page WORDING is weaker evidence
                           # than an actually-harvested sensitive FIELD.
                           # DEC-031 found fusion had no headroom for an
                           # over-eager moderately-weighted signal (cert_intel
                           # was the practical offender); DEC-034 fixed that
                           # at cert_intel's own source (domain-age
                           # corroboration) rather than here, but keeping
                           # semantic_content's own corroboration-by-design
                           # remains the right call regardless.

# Signal names allowed to force label=phishing on their own (a "hard
# override" trigger, independent of the model/other signals) -- reserved
# for near-zero-false-positive triggers only. Note: favicon_match itself
# only *marks* a specific trigger as hard-override internally (an exact
# favicon-hash match, never the weaker perceptual-hash soft match) -- see
# src/detection/signals/favicon_match.py. Listing a signal here is a second,
# independent gate: both the signal's own is_hard_override flag AND this
# list must agree before fusion treats it as decisive.
hard_override_signals:
  - favicon_match

# Risk bands (Phase 3, F5): a graded presentation over the fused risk_score,
# calibrated (not invented) against data/processed/val.parquet -- see
# scripts/calibrate_risk_bands.py and reports/risk_band_calibration.json.
# The "suspicious" floor is deliberately kept equal to fusion_threshold
# above, so a URL's band and its binary label never disagree: label ==
# "phishing" iff band is suspicious/high/critical. Re-run the calibration
# script (and update both this list and fusion_threshold together) if the
# model is ever retrained.
risk_bands:
  - name: low
    floor: 0.0
  - name: caution
    floor: 0.15
  - name: suspicious
    floor: 0.30
  - name: high
    floor: 0.50
  - name: critical
    floor: 0.75

# Hosting platforms where each tenant gets a dedicated, attacker-controlled
# subdomain -- i.e. the SAME curated list threat_intel_config.yaml's
# `subdomain_per_tenant_platforms` uses, for the same reason (an attacker's
# Wix/Vercel/GitHub Pages site is entirely theirs, so judging the visited
# HOSTNAME's freshness/reputation is meaningless there; the page content is
# what matters -- see DEC-018's documented "features measure domain
# legitimacy, not page legitimacy" blind spot). Deliberately duplicated
# rather than shared, since detection_config.yaml and threat_intel_config.yaml
# are two independently-loaded configs (same pattern as feature_config.yaml's
# feature_order vs. contract.py's FEATURE_ORDER being intentionally separate
# lists, DEC-015) -- if you add a platform to one list, add it to the other.
tenant_hosting_platforms:
  - wixstudio.com
  - weebly.com
  - github.io
  - blogspot.com
  - herokuapp.com
  - vercel.app
  - netlify.app
  - repl.co
  - glitch.me
  - 000webhostapp.com

# Per-signal tunables, read by src/detection/__init__.py::run_detection.
signal_params:
  typosquat:
    max_edit_distance: 2
  favicon_match:
    # Hamming distance out of 64 bits for a SOFT logo match (the exact-hash
    # hard-override path is separate and unaffected by this value). Set
    # empirically, not guessed. DEC-026 (16 Jul 2026, 23 populated brands)
    # measured the closest unrelated-brand pair at distance 8 and set this
    # to 3 (a 5-bit margin). DEC-031 (17 Jul 2026) re-ran the same check
    # after the brand reference grew to 166 (113 populated) and found the
    # margin had collapsed to ZERO -- e.g. Square/Ledger/IBM all reduce to
    # the identical degenerate all-zero hash, and Wayfair/Okta collide
    # exactly too. 0 is therefore the strictest value this signal can take;
    # it removes the near-miss collisions (e.g. Stripe/Kraken at distance 2)
    # but does NOT eliminate the exact-hash collisions above -- those are
    # genuine perceptual-hash collisions between different real icons, not
    # a tolerance problem, and are called out as unresolved in DEC-031. If
    # the brand reference grows again, re-run the pairwise-distance check
    # before assuming this value is still safe.
    phash_tolerance: 0
