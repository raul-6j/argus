# ARGUS continuous integration (F1).
#
# Before this existed the project had no CI at all, while its Interim Report
# claimed "Docker and GitHub Actions (continuous integration)" as tools in use
# (audit §6.2). This makes that claim true.
#
# A NOTE ON WHAT CI CAN AND CANNOT RUN, because it is not obvious and a
# workflow that hides it would be worse than no workflow:
#
# `models/production/model.joblib` is git-ignored (Iron Law #5: never commit
# serialized models) and the processed data splits are git-ignored too. So on
# a fresh checkout -- which is exactly what CI gets -- tests/api/conftest.py
# skips every test needing a trained model. Measured on a clean clone:
# 623 pass, 303 skip. That is a third of the suite.
#
# Regenerating the model in CI is not free either: scripts/data_prep.py needs
# the UCI download (no credentials) AND the Kaggle dataset (needs a
# ~/.kaggle/kaggle.json token), per the adopted UCI+Kaggle dataset decision.
#
# So: the always-on job runs what it honestly can and PRINTS the skip count in
# the job summary, and a second, opt-in job runs the complete suite when
# Kaggle credentials are configured as repository secrets. The skip count is
# surfaced rather than buried so nobody reads a green tick as "all 926 tests
# passed".

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run on the same ref; no point paying for
  # results nobody will read.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # Pinned: an unpinned linter turns an upstream release into a red build
      # on an unrelated PR. Matches the version the project lints with locally.
      - run: pip install ruff==0.15.21
      # Deliberately no --select: it OVERRIDES pyproject.toml's configured rule
      # set and produces false RUF100 "unused noqa" reports (a documented
      # gotcha in this project).
      - run: ruff check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # One version failing should still tell us about the others.
      fail-fast: false
      matrix:
        # This matrix is what actually settles the project's supported range,
        # which documentation has so far only asserted. 3.9 is included
        # because it is what the local venv runs and what ruff targets; 3.12
        # is the ceiling the pinned dependency set supports (onnxruntime).
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          # tests/conftest.py sets its own fixed test-only key, but the app
          # fails closed without one at import time in some paths (S6).
          SECRET_KEY: ci-test-key-not-a-secret
          TLDEXTRACT_CACHE: /tmp/tldextract_cache
        run: |
          pytest tests/ -q --no-header --junitxml=junit.xml

      - name: Report skipped tests
        # Runs even on failure: the skip count is diagnostic either way.
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET, pathlib, os
          p = pathlib.Path("junit.xml")
          if not p.exists():
              print("No junit.xml produced."); raise SystemExit(0)
          s = ET.parse(p).getroot()
          suite = s if s.tag == "testsuite" else s.find("testsuite")
          g = lambda k: int(suite.get(k, 0))
          total, skipped = g("tests"), g("skipped")
          print(f"### Python {os.environ['PY_VER']}\n")
          print(f"- ran **{total - skipped}**, skipped **{skipped}**, of {total}\n")
          if skipped:
              print(
                  "> Skips are expected here: `models/production/model.joblib` and the\n"
                  "> processed data splits are git-ignored, so every test needing a\n"
                  "> trained model is skipped on a fresh checkout. Run the\n"
                  "> `full-suite` job to exercise them.\n"
              )
          PY
        env:
          PY_VER: ${{ matrix.python-version }}

  security:
    name: Dependency + SAST scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install scanners
        run: pip install pip-audit==2.7.3 bandit==1.7.9

      # Known-vulnerability scan of the pinned dependency set (audit M-11: the
      # project had no dependency scanning of any kind).
      #
      # NON-BLOCKING, deliberately and temporarily. The first run of this scan
      # found 40 advisories across 12 packages, 8 of them direct dependencies
      # -- Pillow (18), onnx (8), requests (2), lxml, flask, marshmallow,
      # pytest, pyarrow. Two of those parse attacker-controlled input in this
      # application specifically: Pillow decodes remote favicons for the
      # favicon-match signal, and lxml parses fetched phishing pages.
      #
      # Making this blocking today would leave CI permanently red until a
      # triaged upgrade pass lands (onnx/onnxruntime/skl2onnx are version-
      # coupled, and marshmallow 4.x is an API break), and a red-by-default
      # pipeline trains people to ignore it. So it reports loudly on every run
      # instead. Flip continue-on-error to false once the upgrade pass is done
      # -- that is the point of recording the number here.
      - name: pip-audit
        id: audit
        continue-on-error: true
        run: |
          pip-audit --requirement requirements.txt --strict \
            --format markdown --output audit.md
      - name: Publish audit findings
        if: always()
        run: |
          {
            echo "### Dependency advisories"
            if [ "${{ steps.audit.outcome }}" = "success" ]; then
              echo "No known advisories in the pinned set."
            else
              echo ""
              cat audit.md 2>/dev/null || echo "pip-audit produced no report."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Static analysis. -ll reports medium severity and above: the low band is
      # dominated by "assert used in tests" style findings that would bury the
      # signal. src/ only -- tests deliberately do things production code must
      # not.
      - name: bandit
        run: bandit -r src/ -ll

  extension:
    name: Browser extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      # `npm ci` not `npm install`: installs exactly the lockfile, and fails if
      # package.json and the lockfile disagree.
      - run: npm ci
      - run: npm test
      - run: npm run lint

      # Validates the MV3 manifest against Firefox's requirements (F14). Needs
      # no Firefox binary. --self-hosted matches how this add-on is distributed.
      - run: npx web-ext lint --source-dir=. --self-hosted

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Build only, never push. The image cannot be a *useful* artefact from a
      # clean checkout anyway -- model.joblib is git-ignored, so a container
      # built here would fail create_app()'s startup check. What this job
      # verifies is that the Dockerfile itself is valid and its dependency
      # install resolves, which is the part that silently rots.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: argus:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the entrypoint and config are importable in the image
        run: |
          docker run --rm --entrypoint python argus:ci -c \
            "import gunicorn, flask, sklearn; print('runtime deps import OK')"
          docker run --rm --entrypoint python argus:ci -c \
            "import runpy; runpy.run_path('gunicorn.conf.py'); print('gunicorn.conf.py OK')"

  full-suite:
    name: Full suite (trains a real model)
    runs-on: ubuntu-latest
    # Opt-in. Without Kaggle credentials scripts/data_prep.py cannot assemble
    # the adopted UCI+Kaggle dataset, so this would fail for every fork and
    # every contributor who has not configured the secret. Skipping cleanly
    # beats a permanently red required check.
    if: vars.RUN_FULL_SUITE == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Prepare data, train, evaluate
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          TLDEXTRACT_CACHE: /tmp/tldextract_cache
        run: |
          python scripts/data_prep.py
          python scripts/train.py --config configs/model_config.yaml
          python scripts/evaluate.py --config configs/model_config.yaml

      - name: Run the complete suite with coverage
        env:
          SECRET_KEY: ci-test-key-not-a-secret
          TLDEXTRACT_CACHE: /tmp/tldextract_cache
        run: pytest tests/ -q --no-header --cov=src --cov-report=term-missing
